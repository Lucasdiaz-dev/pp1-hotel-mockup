<!DOCTYPE html>
<!-- Twig: todo este esqueleto = templates/base.html.twig.
     <header> = {% include '_header.html.twig' %} (menú según is_granted: visitante / ROLE_USER / ROLE_ADMIN);
     el contenido de <main> = {% block body %}; .flash = loop de app.flashes en base. {% block title %} = <title>. -->
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mi perfil · Hotel Litoral</title><link rel="stylesheet" href="styles.css"></head>
<body><div class="shell"><div class="frame">
<header class="top"><a class="brand" href="index.html"><span class="logo">HL</span>Hotel Litoral</a>
<nav class="pillnav"><a href="index.html">Buscar</a><a href="mis-reservas.html">Mis reservas</a><a href="perfil.html" class="on">Mi perfil</a></nav>
<div class="user"><span class="avatar"></span>Lucas D. · <a href="index.html" class="muted">Salir</a></div></header>
<main><div class="crumbs">Inicio › Mi perfil</div>
<!-- {% block body %} -->
<!-- CU007 – el email debe ser único. Cambiar contraseña es opcional. -->
<h1>Mi perfil</h1><form class="form" action="perfil.html">
<div><label>Nombre <span class="req">*</span></label><input required value="Lucas"></div><div><label>Apellido <span class="req">*</span></label><input required value="Díaz"></div>
<div class="full"><label>Email <span class="req">*</span></label><input type="email" required value="lucas@email.com"><!-- El email debe ser único --></div>
<div class="full"><label>Teléfono <span class="req">*</span></label><input type="tel" required value="342 555-1234"></div>
<details class="full panel"><summary><b>Cambiar contraseña (opcional)</b></summary><div class="form" style="margin-top:12px"><div><label>Nueva contraseña</label><input type="password"></div><div><label>Repetir nueva contraseña</label><input type="password"></div></div></details>
<!-- Error ej.: "Ya existe otra cuenta con ese email." -->
<div class="full" style="display:flex;gap:10px"><button class="btn dark">Guardar cambios</button><a class="btn" href="index.html">Cancelar</a></div></form>
<!-- {% endblock %} --></main></div>
<footer>Hotel Litoral · Mockup PP1 v1.4 – no funcional · Vistas: <a href="index.html"><u>visitante</u></a> · <a href="mis-reservas.html"><u>cliente</u></a> · <a href="admin-habitaciones.html"><u>administrador</u></a></footer></div></body></html>
